server {
    listen 80;
    root /usr/share/nginx/html;

    # Share links are short-lived secrets: never leak them to other sites.
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # API and live updates (WebSocket) go to the backend container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;       # keep idle WebSockets open
        client_max_body_size 6m;     # GPX uploads
    }

    # Fingerprinted build assets can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: every other path (e.g. /s/<token>) serves index.html.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Referrer-Policy "no-referrer" always;
    }
}
