<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0a1220" />
    <title>¿Dónde estoy? — llegada en directo</title>
    <meta name="description" content="Comparte tu ruta de montaña en directo y que sepan cuándo llegas." />
    <!-- Link previews (WhatsApp, Telegram…) -->
    <meta property="og:title" content="¿Dónde estoy? — sígueme en directo" />
    <meta property="og:description" content="Mira dónde estoy ahora y a qué hora llego." />
    <meta property="og:type" content="website" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Apply the saved theme before first paint (dark is the default).
      try {
        var t = localStorage.getItem("de.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
